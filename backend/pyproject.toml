[project]
name = "harikatha-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "numpy>=2.5.4",
]

[project.optional-dependencies]\ntts = [\n  "torch>=2.2",\n  "transformers>=4.46",\n  "parler-tts>=0.2.2",\n  "accelerate>=0.34",\n  "sentencepiece>=0.2",\n]\n\n[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
