name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "local_tts/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "local_tts/**", ".github/workflows/backend.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      MOCK_SARVAM: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check . ../local_tts
      - run: uv run pytest -q
